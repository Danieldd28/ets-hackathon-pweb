<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catatan Keuangan Freelancer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>Catatan Keuangan Freelancer</h1>
  </header>

  <main>
    <section id="ringkasan">
      <h2>Ringkasan</h2>
      <div class="kartu-ringkasan">
        <p>Pemasukan <strong id="total-pemasukan"></strong></p>
        <p>Pengeluaran <strong id="total-pengeluaran"></strong></p>
        <p>Saldo <strong id="saldo"></strong></p>
        <p>Total piutang <strong id="total-piutang"></strong></p>
      </div>
    </section>

    <section id="tagihan">
      <h2>Tagihan ke klien</h2>
      <form id="form-tagihan" novalidate>
        <label for="tagihan-tanggal">Tanggal tagihan</label>
        <input id="tagihan-tanggal" type="date">

        <label for="tagihan-klien">Klien</label>
        <input id="tagihan-klien" type="text" autocomplete="off">

        <label for="tagihan-nominal">Nominal (Rp)</label>
        <input id="tagihan-nominal" type="number" min="0">

        <button type="submit">Tambah tagihan</button>
        <p id="error-tagihan" class="error" role="alert"></p>
      </form>
      <ul id="daftar-tagihan"></ul>
    </section>

    <section id="transaksi">
      <h2 id="judul-form">Tambah transaksi</h2>
      <form id="form-transaksi" novalidate>
        <label for="input-tanggal">Tanggal</label>
        <input id="input-tanggal" type="date">

        <label for="input-jenis">Jenis</label>
        <select id="input-jenis">
          <option value="pemasukan">Pemasukan</option>
          <option value="pengeluaran">Pengeluaran</option>
        </select>

        <label for="input-kategori">Kategori</label>
        <select id="input-kategori"></select>

        <label for="input-nominal">Nominal (Rp)</label>
        <input id="input-nominal" type="number" min="0">

        <label for="input-catatan">Catatan (opsional)</label>
        <input id="input-catatan" type="text" autocomplete="off">

        <button id="tombol-simpan" type="submit">Simpan</button>
        <button id="tombol-batal-edit" type="button" hidden>Batal edit</button>
        <p id="error-transaksi" class="error" role="alert"></p>
      </form>
    </section>

    <section id="daftar">
      <h2>Daftar transaksi</h2>
      <div id="filter">
        <label for="filter-jenis">Jenis</label>
        <select id="filter-jenis" name="jenis">
          <option value="">Semua</option>
          <option value="pemasukan">Pemasukan</option>
          <option value="pengeluaran">Pengeluaran</option>
        </select>

        <label for="filter-kategori">Kategori</label>
        <select id="filter-kategori" name="kategori">
          <option value="">Semua</option>
        </select>

        <label for="filter-dari">Dari tanggal</label>
        <input id="filter-dari" name="dari" type="date">

        <label for="filter-sampai">Sampai tanggal</label>
        <input id="filter-sampai" name="sampai" type="date">

        <label for="filter-cari">Cari catatan</label>
        <input id="filter-cari" name="cari" type="text" autocomplete="off">
      </div>
      <ul id="daftar-transaksi"></ul>
    </section>
  </main>

  <footer>
    <p>ETS Pemrograman Web — Persona: Pekerja lepas</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
